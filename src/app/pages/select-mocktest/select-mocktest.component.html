<app-header1></app-header1>

<div class="smt-page-wrapper">

  <!-- PAGE HEADER -->
  <div class="smt-page-header">
    <h1 class="smt-page-title">Select Mock Test</h1>
    <p class="smt-page-subtitle">Access your scheduled assessments and upcoming exams.</p>
  </div>

  <!-- MOCK TEST CARDS GRID -->
  <div class="smt-cards-grid">

    <div
      *ngFor="let test of mockTests"
      class="smt-card"
      [class.smt-card--live]="test.status === 'live'"
      [class.smt-card--coming-soon]="test.status === 'coming-soon'"
    >
      <!-- Card Top Row: Status Badge + Questions -->
      <div class="smt-card-top">
        <span
          class="smt-status-badge"
          [class.smt-status-badge--live]="test.status === 'live'"
          [class.smt-status-badge--coming]="test.status === 'coming-soon'"
        >
          <span *ngIf="test.status === 'live'" class="smt-live-dot"></span>
          {{ test.status === 'live' ? 'Live Now' : 'Coming Soon' }}
        </span>

        <div class="smt-questions-info">
          <svg class="smt-questions-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          <span>{{ test.questions }} Questions</span>
        </div>
      </div>

      <!-- Card Body: Title + Description -->
      <div class="smt-card-body">
        <h2 class="smt-card-title">{{ test.title }}</h2>
        <p class="smt-card-description">{{ test.description }}</p>
      </div>

      <!-- Card Divider -->
      <hr class="smt-card-divider" />

      <!-- Card Footer: Availability + Action Button -->
      <div class="smt-card-footer">

        <div *ngIf="test.status === 'live'" class="smt-availability">
          <svg class="smt-availability-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <span>Available</span>
        </div>

        <button
          class="smt-action-btn"
          [class.smt-action-btn--active]="test.status === 'live'"
          [class.smt-action-btn--disabled]="test.status === 'coming-soon'"
          [disabled]="test.status === 'coming-soon'"
          (click)="startTest(test)"
        >
          {{ test.status === 'live' ? 'Start Test' : 'Coming Soon' }}
        </button>

      </div>
    </div>

  </div>
</div>
