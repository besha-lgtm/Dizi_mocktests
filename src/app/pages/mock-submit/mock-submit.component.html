<app-header1></app-header1>
<div class="submit-page-wrapper">
    <div class="submit-container">
        <!-- Success Icon -->
        <div class="success-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
        </div>

        <!-- Title -->
        <h1 class="submit-title">{{ submitData.title }}</h1>

        <!-- Message -->
        <p class="submit-message">{{ submitData.message }}</p>

        <div class="feedback-timer-card" aria-live="polite">
            <span class="feedback-timer-label">Feedback form opens in</span>
            <strong class="feedback-timer-value">{{ timerDisplay }}</strong>
        </div>

        <!-- Submission Details Card -->
        <div class="submission-details">
            <p class="detail-label">{{ submitData.description }}</p>
            <div class="detail-content">
                <p class="submission-id">
                    <span class="label">Submission ID:</span> 
                    <span class="value">{{ submitData.submissionId }}</span>
                </p>
                <p class="timestamp">
                    <span class="label">Timestamp:</span> 
                    <span class="value">{{ submitData.timestamp }}</span>
                </p>
            </div>
        </div>
    </div>
</div>
