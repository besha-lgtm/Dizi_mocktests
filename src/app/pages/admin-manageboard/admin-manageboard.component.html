<app-header1></app-header1>
<app-admin-sidebar></app-admin-sidebar>

<div class="am-page-wrapper">

    <div class="top-back-wrapper">

        <!-- Back Button -->

    </div>

    <!-- HEADER -->
    <div class="am-page-header">

        <div class="am-page-header-text">

            <h1 class="am-page-title">
                Admin Management Dashboard
            </h1>

            <p class="am-page-subtitle">
                Monitor students, mock tests, courses and platform activity.
            </p>

        </div>

        <button
            class="am-add-btn"
            (click)="openAddModal()">

            <i class="fa-solid fa-plus"></i>

            Add New Student

        </button>

    </div>

    <!-- STATS -->
    <div class="am-stats-grid">

        <div class="am-stat-card">

            <div class="am-stat-icon">
                <i class="fa-solid fa-user-graduate"></i>
            </div>

            <div class="am-stat-body">

                <p class="am-stat-label">
                    Students Enrolled
                </p>

                <p class="am-stat-value">
                    {{ students.length }}
                </p>

            </div>

        </div>

        <div class="am-stat-card">

            <div class="am-stat-icon">
                <i class="fa-solid fa-file-pen"></i>
            </div>

            <div class="am-stat-body">

                <p class="am-stat-label">
                    Mock Test 1
                </p>

                <p class="am-stat-value">
                    {{ mock1Attempts }}
                </p>

            </div>

        </div>

        <div class="am-stat-card">

            <div class="am-stat-icon">
                <i class="fa-solid fa-chart-column"></i>
            </div>

            <div class="am-stat-body">

                <p class="am-stat-label">
                    Mock Test 2
                </p>

                <p class="am-stat-value">
                    {{ mock2Attempts }}
                </p>

            </div>

        </div>

        <div class="am-stat-card">

            <div class="am-stat-icon">
                <i class="fa-solid fa-book"></i>
            </div>

            <div class="am-stat-body">

                <p class="am-stat-label">
                    Courses
                </p>

                <p class="am-stat-value">
                    {{ totalCourses }}
                </p>

            </div>

        </div>

    </div>

</div>
