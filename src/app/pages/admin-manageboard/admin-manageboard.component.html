  <!-- HEADER -->
  <div class="ml-page-header">

    <div class="ml-page-header-text">
      <h1 class="ml-page-title">
        Admin Management Dashboard
      </h1>

      <p class="ml-page-subtitle">
        Monitor students, mock tests, courses and platform activity.
      </p>
    </div>

    <button class="ml-add-btn" (click)="openAddModal()">
      <i class="fa-solid fa-plus"></i>
      Add New Student
    </button>

  </div>

  <!-- STATS -->
  <div class="ml-stats-grid">

    <div class="ml-stat-card">
      <div class="ml-stat-icon">
        <i class="fa-solid fa-user-graduate"></i>
      </div>

      <div class="ml-stat-body">
        <p class="ml-stat-label">Students Enrolled</p>
        <p class="ml-stat-value">{{ students.length }}</p>
      </div>
    </div>

    <div class="ml-stat-card">
      <div class="ml-stat-icon">
        <i class="fa-solid fa-file-pen"></i>
      </div>

      <div class="ml-stat-body">
        <p class="ml-stat-label">Mock Test 1</p>
        <p class="ml-stat-value">{{ mock1Attempts }}</p>
      </div>
    </div>

    <div class="ml-stat-card">
      <div class="ml-stat-icon">
        <i class="fa-solid fa-chart-column"></i>
      </div>

      <div class="ml-stat-body">
        <p class="ml-stat-label">Mock Test 2</p>
        <p class="ml-stat-value">{{ mock2Attempts }}</p>
      </div>
    </div>

    <div class="ml-stat-card">
      <div class="ml-stat-icon">
        <i class="fa-solid fa-book"></i>
      </div>

      <div class="ml-stat-body">
        <p class="ml-stat-label">Courses</p>
        <p class="ml-stat-value">{{ totalCourses }}</p>
      </div>
    </div>

  </div>


</div>
