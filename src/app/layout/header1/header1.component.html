<header class="jee-header">
  <div class="header-container">
    <!-- Left Section: Logo & Title -->
    <div class="left-section">
      <div class="logo-container" role="img" aria-label="JEE Advanced Logo">
        <div class="jee-badge">
          <span>{{ logoText }}</span>
        </div>
        <div class="badge-subtext">{{ logoSubtext }}</div>
      </div>
      
      <div class="title-wrapper">
        <h1 class="main-title">{{ examTitle }}</h1>
        <h2 class="sub-title">{{ examSubtitle }}</h2>
      </div>
    </div>

    <!-- Right Section: Organizing Institute Info -->
    <div class="right-section">
      <div class="institute-info">
        <p class="institute-name">{{ organizingInstitute }}</p>
        <p class="role-label">{{ roleTitle }}</p>
      </div>
    </div>
  </div>
</header>
